services:
  - type: web
    name: esrgan-upscaler
    env: python
    region: oregon  
    plan: free  
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd web && gunicorn --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --threads 2 app:app"
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true  
      - key: TF_CPP_MIN_LOG_LEVEL
        value: 2  